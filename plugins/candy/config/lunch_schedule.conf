# Claude Candy 사용자 스케줄 설정
# candy-setup 시 사용자 입력으로 채워진다.
# sync 시에도 보존된다 (사용자 파일이 있으면 번들이 덮어쓰지 않음).

# ─── 점심 시간 (5h 윈도우 안으로 흡수) ───
# CYCLE_ANCHOR: 이 날짜가 속한 주의 점심 = CYCLE_PATTERN 첫 번째 값
# CYCLE_PATTERN: 쉼표 구분, 1~N 항목, N주 단위 순환 (HH:MM-HH:MM)
CYCLE_ANCHOR="2026-04-13"
CYCLE_PATTERN="12:30-13:30,12:00-13:00,13:00-14:00"

# ─── 출근 시간 (pre-warm hard constraint) ───
# pre-warm 은 반드시 출근 시간 전에 실행되어야 candy 가 윈도우 boundary 를 만들 수 있다.
# 유효 pre-warm 범위: (WORK_START - 5h, WORK_START]
# 예) WORK_START_HOUR=9 → pre-warm ∈ (04:00, 09:00]
WORK_START_HOUR=9
WORK_START_MIN=0
